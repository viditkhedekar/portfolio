<!doctype html>
<meta charset="utf-8" />
<title>VKOS render harness</title>
<style>
  html, body { margin: 0; background: #05070a; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 10px; bottom: 10px; z-index: 5;
    font: 11px ui-monospace, Menlo, monospace; color: #8fa0b0;
    background: rgba(0,0,0,.6); padding: 6px 9px; border: 1px solid #222a31;
  }
</style>
<div id="hud">idle</div>

<script type="importmap">
{
  "imports": {
    "three": "/three/build/three.module.js",
    "three/addons/": "/three/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
  import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";
  import { buildEnvironment } from "./environment.mjs";
  import { buildKit, createLightPool } from "./kit.mjs";
  import { buildFacility } from "./facility.mjs";
  import { createSurfaceRegistry } from "./surfaces.mjs";
  import { buildCorridor, buildThreshold } from "./links.mjs";
  import { buildObservatory } from "./observatory.mjs";
  import { buildVault } from "./vault.mjs";
  import { buildChamber } from "./chamber.mjs";
  import { buildComms } from "./comms.mjs";
  import { samplePath, sampleAir } from "./path.mjs";

  const hud = document.getElementById("hud");
  const say = (m) => { hud.textContent = m; };

  /*
   * The harness renders at whatever size it is told to and never resizes
   * itself to the window: a frame has to come out at the same dimensions
   * every time, whatever the pane the browser happens to be in.
   */
  const state = { width: 1600, height: 900 };

  const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance",
  });
  renderer.setPixelRatio(1);
  renderer.setSize(state.width, state.height, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a0d);
  /* Fog is what turns a hundred and sixty metres of hall into somewhere with
     a far end you cannot see. Density is the whole mood control. */
  scene.fog = new THREE.FogExp2(0x0a0f14, 0.0165);

  const camera = new THREE.PerspectiveCamera(52, state.width / state.height, 0.1, 700);

  /* Reflections first: the materials read it off the scene when they compile. */
  scene.environment = buildEnvironment(THREE, renderer);

  /* One kit and one light pool for the whole building. Every room registers
     its emitters with the same pool, so the scene never carries more than ten
     real lights however many fixtures are modelled. */
  const kit = buildKit(THREE);
  const pool = createLightPool(THREE, scene, { size: 10, shadows: 3, reach: 48 });
  /* Every readable thing in the building registers itself here as a rectangle
     in world space. The render draws the fitting; the page fills the face. */
  const surfaces = createSurfaceRegistry();

  scene.add(new THREE.AmbientLight(0x38495a, 0.85));
  const fill = new THREE.DirectionalLight(0x6f8fac, 0.55);
  fill.position.set(-6, 14, 20);
  scene.add(fill);

  /* The building, front to back. Corridors overshoot into the rooms they
     serve so their mouths read as tunnels breaking through a wall, which is
     cheaper and truer than cutting real holes. */
  buildCorridor(THREE, scene, kit, pool, { from: 46, to: 8, width: 9, height: 6, accent: true });
  buildThreshold(THREE, scene, kit, pool, { z: 9, width: 8.4, height: 5.6 });

  buildFacility(THREE, scene, kit, pool, surfaces);

  buildCorridor(THREE, scene, kit, pool, { from: -150, to: -206, width: 9, height: 6, accent: true });
  buildObservatory(THREE, scene, kit, pool);
  buildCorridor(THREE, scene, kit, pool, { from: -258, to: -302, width: 9, height: 6, accent: true });

  buildVault(THREE, scene, kit, pool);

  buildCorridor(THREE, scene, kit, pool, { from: -404, to: -424, width: 9, height: 6 });
  buildThreshold(THREE, scene, kit, pool, { z: -419, width: 8.4, height: 5.6 });

  buildChamber(THREE, scene, kit, pool);

  buildCorridor(THREE, scene, kit, pool, { from: -470, to: -494, width: 9, height: 6 });
  buildComms(THREE, scene, kit, pool);

  const composer = new EffectComposer(renderer);
  composer.setSize(state.width, state.height);
  composer.addPass(new RenderPass(scene, camera));

  /* Bloom is not decoration here. Every light source in the scene is a small
     bright object in a dark, hazy room, and bloom is what makes those read as
     emitting light rather than being painted a lighter colour. */
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(state.width, state.height),
    0.62, // strength
    0.72, // radius
    0.62, // threshold
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass());

  const look = new THREE.Vector3();
  const pos = [0, 0, 0];
  const target = [0, 0, 0];
  const airNow = { r: 0, g: 0, b: 0, density: 0.02, exposure: 1 };

  function place(progress) {
    samplePath(progress, pos, target);
    camera.position.set(pos[0], pos[1], pos[2]);
    look.set(target[0], target[1], target[2]);
    camera.lookAt(look);

    sampleAir(progress, airNow);
    scene.fog.color.setRGB(airNow.r, airNow.g, airNow.b);
    scene.fog.density = airNow.density;
    scene.background.setRGB(airNow.r, airNow.g, airNow.b);
    renderer.toneMappingExposure = airNow.exposure;

    pool.update(camera);
  }

  function draw(progress) {
    place(progress);
    composer.render();
  }

  async function post(dir, name, quality) {
    const data = renderer.domElement.toDataURL("image/webp", quality);
    const res = await fetch("/frame", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ dir, name, data }),
    });
    return res.json();
  }

  /** Everything the agent drives from outside. */
  window.VK = {
    ready: true,

    resize(w, h) {
      state.width = w;
      state.height = h;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      bloom.resolution.set(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    },

    /** One frame, at a scroll fraction, written to disk. */
    async still(progress, name, quality = 0.9) {
      draw(progress);
      const out = await post("render-tests", name, quality);
      say(`still ${name} · ${out.bytes} bytes`);
      return out;
    },

    /**
     * The manifest the page needs to lay HTML onto the walls.
     *
     * The camera is sampled per frame and the surfaces once, because a
     * surface does not move and a per-frame copy of forty of them would be a
     * megabyte of JSON for no reason. The page reprojects them itself, using
     * the same numbers this render used, so the text lands exactly where the
     * fitting was photographed.
     */
    async manifest(frames) {
      const camera_ = [];
      for (let i = 0; i < frames; i++) {
        place(i / (frames - 1));
        camera.updateMatrixWorld(true);
        const p = camera.position;
        const q = camera.quaternion;
        camera_.push([p.x, p.y, p.z, q.x, q.y, q.z, q.w].map((n) => Math.round(n * 10000) / 10000));
      }

      const data = {
        frames,
        width: state.width,
        height: state.height,
        fov: camera.fov,
        camera: camera_,
        surfaces: surfaces.export(THREE),
      };

      const res = await fetch("/frame", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          dir: "seq",
          name: "manifest.json",
          data: "json," + btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
        }),
      });
      const out = await res.json();
      say(`manifest · ${data.surfaces.length} surfaces · ${out.bytes} bytes`);
      return { surfaces: data.surfaces.length, bytes: out.bytes };
    },

    /** The whole flight. */
    async sequence(frames, dir, quality) {
      let total = 0;
      for (let i = 0; i < frames; i++) {
        draw(i / (frames - 1));
        const name = String(i).padStart(4, "0") + ".webp";
        const out = await post(dir, name, quality);
        total += out.bytes;
        if (i % 5 === 0) say(`frame ${i + 1}/${frames} · ${(total / 1048576).toFixed(2)} MB`);
        /* Yield, or the tab is locked solid for the whole run and the browser
           kills it. */
        await new Promise((r) => setTimeout(r, 0));
      }
      say(`done · ${frames} frames · ${(total / 1048576).toFixed(2)} MB`);
      window.VK.result = { frames, bytes: total };
      return window.VK.result;
    },
  };

  draw(0.5);
  say("ready");
</script>
